<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <link rel="stylesheet" href="css/css.css">
    <link rel="stylesheet" href="css/bootstrap-material-design.min.css">
    <link rel="manifest" href="manifest.json">
    <title>PWA iUdigital</title>

</head>
<body class="bg-light d-flex align-items-center justify-content-content min-vh-100 py-5">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-8 col-md-6 col-lg-4">
        
        <div class="card shadow-sm border-0 rounded-lg">
          <div class="card-body p-4 text-center">
            
            <!-- Logo de la Universidad -->
            <img src="iu_digital_case_study_logo.webp" alt="Logo IU Digital" class="img-fluid mb-3" style="max-width: 130px;">
            
            <h4 class="card-title font-weight-bold text-dark mb-1">Campus Virtual</h4>
            <p class="text-muted small mb-4">Ingresa tus credenciales para acceder</p>

            <!-- Formulario de Login -->
            <form id="loginForm">
              <div class="form-group text-left mb-3">
                <label for="email" class="bmd-label-floating">Correo institucional</label>
                <input type="email" class="form-control" id="email" required>
              </div>

              <div class="form-group text-left mb-4">
                <label for="password" class="bmd-label-floating">Contraseña</label>
                <input type="password" class="form-control" id="password" required>
              </div>

              <button type="submit" class="btn btn-primary btn-block btn-raised py-2 mt-3" style="background-color: #d32f2f; border-color: #d32f2f;">
                Iniciar Sesión
              </button>
            </form>

            <div class="mt-4">
              <a href="#" class="small text-secondary">¿Olvidaste tu contraseña?</a>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

    <script src="js/jquery-3.2.1.slim.min.js"></script>
    <script src="js/popper.js"></script>
    <script src="js/bootstrap-material-design.js"></script>

    <script>
      $(document).ready(function() { 
        $('body').bootstrapMaterialDesign(); 
      });
    </script>

    <script src="js/app.js"></script>

</body>
</html>
